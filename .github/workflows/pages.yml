name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["beta"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Don't use shallow clone - codemirror2 submodule doesn't support it
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Install Jekyll
        run: gem install jekyll bundler

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Pre-process files
        run: |
          # Replace $GIT_COMMIT with actual commit hash in HTML files
          GIT_COMMIT=$(git rev-parse HEAD)
          echo "Git commit: $GIT_COMMIT"

          # Find and process HTML files
          find cslEditorLib/pages -name "*.html" -o -name "index.html" | while read file; do
            if [ -f "$file" ]; then
              echo "Processing $file"
              sed "s/\$GIT_COMMIT/$GIT_COMMIT/g" "$file" > "$file.tmp"
              mv "$file.tmp" "$file"
            fi
          done

          # Remove PHP files (security)
          find external -name "*.php" -type f -delete 2>/dev/null || true
          find cslEditorLib/external -name "*.php" -type f -delete 2>/dev/null || true

      - name: Build with Jekyll
        run: |
          jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
