name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["beta"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Don't use shallow clone - codemirror2 submodule doesn't support it
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build cslEditorLib
        run: |
          cd cslEditorLib
          npm install
          npm run build:styles
          npm run build:citations
          cd ..

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Install Jekyll
        run: gem install jekyll bundler

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Pre-process files
        run: |
          # Replace $GIT_COMMIT with actual commit hash in ALL relevant files
          GIT_COMMIT=$(git rev-parse HEAD)
          echo "Git commit: $GIT_COMMIT"

          # Process HTML files
          find . -name "*.html" -type f | while read file; do
            echo "Processing $file"
            sed -i "s/\\\$GIT_COMMIT/$GIT_COMMIT/g" "$file"
          done

          # Process JS files that might have cache busters
          find . -name "*.js" -type f | while read file; do
            sed -i "s/\\\$GIT_COMMIT/$GIT_COMMIT/g" "$file"
          done

          # Remove PHP files (security)
          find . -name "*.php" -type f -delete 2>/dev/null || true

      - name: Build with Jekyll
        run: |
          jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
